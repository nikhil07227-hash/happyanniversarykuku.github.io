<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary Kuku ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff4da6, #ff99cc);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* CARD CONTAINER */
.card-container {
    perspective: 1200px;
}

.card {
    width: 320px;
    height: 450px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s;
}

.card.open {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

/* FRONT */
.front {
    background: white;
    cursor: pointer;
}

.front h2 {
    color: #ff1a8c;
}

/* BACK */
.back {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    transform: rotateY(180deg);
    padding: 20px;
    text-align: center;
    overflow-y: auto;
}

/* GLOWING NAME */
.glow-name {
    font-size: 28px;
    font-weight: bold;
    color: white;
    animation: glowPulse 2s infinite alternate;
    text-shadow: 
        0 0 10px #ff4da6,
        0 0 20px #ff1a8c,
        0 0 30px #ff66cc;
}

@keyframes glowPulse {
    from {
        text-shadow: 
            0 0 10px #ff4da6,
            0 0 20px #ff1a8c;
    }
    to {
        text-shadow: 
            0 0 20px #ff1a8c,
            0 0 30px #ff66cc,
            0 0 40px #ffb3ec;
    }
}

.love-line {
    margin-top: 5px;
    font-size: 18px;
    color: white;
    animation: floatText 3s infinite ease-in-out;
}

@keyframes floatText {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

/* BANNER */
.banner {
    margin-top: 15px;
    font-size: 14px;
    color: white;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% {opacity:0.6;}
    50% {opacity:1;}
    100% {opacity:0.6;}
}

/* CAKE */
.cake {
    position: relative;
    width: 200px;
    height: 200px;
    margin-top: 15px;
    cursor: pointer;
}

.layer {
    position: absolute;
    border-radius: 20px;
}

.layer-bottom {
    bottom: 0;
    width: 200px;
    height: 70px;
    background: #ff66b2;
}

.layer-middle {
    bottom: 60px;
    width: 160px;
    height: 60px;
    left: 20px;
    background: #ff3385;
}

.layer-top {
    bottom: 115px;
    width: 120px;
    height: 50px;
    left: 40px;
    background: #ff1a75;
}

/* CREAM DRIPS */
.drip {
    position: absolute;
    width: 18px;
    height: 25px;
    background: #fff0f5;
    border-radius: 50%;
}

.drip1 { bottom: 50px; left: 30px; }
.drip2 { bottom: 50px; right: 30px; }
.drip3 { bottom: 105px; left: 90px; }

/* CANDLES */
.candle {
    position: absolute;
    bottom: 165px;
    width: 8px;
    height: 30px;
    background: white;
    border-radius: 4px;
}

.flame {
    width: 10px;
    height: 18px;
    background: orange;
    border-radius: 50%;
    margin: auto;
    margin-top: -15px;
    animation: flicker 0.2s infinite alternate;
}

@keyframes flicker {
    from {transform: scale(1);}
    to {transform: scale(1.2);}
}

</style>
</head>

<body>

<div class="card-container">
    <div class="card" id="card">

        <!-- FRONT -->
        <div class="card-face front" onclick="openCard()">
            <h2>Tap To Open 💌</h2>
        </div>

        <!-- BACK -->
        <div class="card-face back">

            <div class="glow-name">Kuku 💖</div>
            <div class="love-line">Niku ❤️ Kuku</div>

            <div class="banner">💨 Tap Cake To Blow Candles 💨</div>

            <div class="cake" onclick="blowCandles()">

                <!-- Candles -->
                <div class="candle" style="left:35%">
                    <div class="flame"></div>
                </div>

                <div class="candle" style="left:50%">
                    <div class="flame"></div>
                </div>

                <div class="candle" style="left:65%">
                    <div class="flame"></div>
                </div>

                <!-- Layers -->
                <div class="layer layer-top"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-bottom"></div>

                <!-- Drips -->
                <div class="drip drip1"></div>
                <div class="drip drip2"></div>
                <div class="drip drip3"></div>

            </div>

        </div>

    </div>
</div>

<script>
function openCard() {
    document.getElementById("card").classList.add("open");
}

function blowCandles() {
    document.querySelectorAll(".flame").forEach(f => {
        f.style.display = "none";
    });
    confettiBlast();
}

function confettiBlast() {
    for (let i = 0; i < 120; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.background = "hsl(" + Math.random()*360 + ",100%,50%)";
        confetti.style.top = "-10px";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.transition = "transform 3s linear, opacity 3s";
        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.style.transform = "translateY(100vh)";
            confetti.style.opacity = 0;
        }, 10);

        setTimeout(() => {
            confetti.remove();
        }, 3000);
    }
}
</script>

</body>
</html>
